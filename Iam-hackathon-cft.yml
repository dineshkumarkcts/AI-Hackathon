AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AI Hackathon - 50 IAM Policies and Roles across RED (Critical), AMBER (Moderate),
  and GREEN (Low Risk) categories. Deployed in us-east-1 for sandbox demonstration.

Metadata:
  CategorySummary:
    RED: "Policies 1-17 — Critical risk: wildcard actions, no MFA, cross-account, public access"
    AMBER: "Policies 18-33 — Moderate risk: broad service perms, missing constraints, overprovisioned"
    GREEN: "Policies 34-50 — Low risk: scoped ARNs, MFA enforced, purpose-matched, reviewed"

# ============================================================
# PARAMETERS
# ============================================================
Parameters:
  HackathonTag:
    Type: String
    Default: "AI-Hackathon-2024"
  TrustedAccountId:
    Type: String
    Default: "123456789012"
    Description: "Simulated external account for cross-account trust demos (RED category)"
  SandboxBucketName:
    Type: String
    Default: "hackathon-sandbox-demo-bucket"

# ============================================================
# RESOURCES
# ============================================================
Resources:

  # ============================================================
  # ██████╗ ███████╗██████╗      CATEGORY: RED (Critical)
  # ██╔══██╗██╔════╝██╔══██╗     Policies 1–17 | Roles 1–17
  # ██████╔╝█████╗  ██║  ██║
  # ██╔══██╗██╔══╝  ██║  ██║
  # ██║  ██║███████╗██████╔╝
  # ╚═╝  ╚═╝╚══════╝╚═════╝
  # ============================================================

  # --- RED Policy 1: Wildcard Admin (All Actions, All Resources) ---
  RedPolicy01WildcardAdmin:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "RED-01-WildcardAdmin-AllActionsAllResources"
      Description: "[RED] Wildcard *:* on all resources - Critical misconfiguration demo"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "WildcardAdminAllActionsAllResources"
            Effect: Allow
            Action: "*"
            Resource: "*"

  RedRole01WildcardAdmin:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "RED-Role-01-WildcardAdmin"
      Description: "[RED] Role with full wildcard admin - Critical"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RedPolicy01WildcardAdmin
      Tags:
        - Key: Category
          Value: RED
        - Key: RiskLevel
          Value: Critical
        - Key: Hackathon
          Value: !Ref HackathonTag

  # --- RED Policy 2: Wildcard Resource ARN ---
  RedPolicy02WildcardResourceArn:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "RED-02-WildcardResourceArn"
      Description: "[RED] Uses arn:aws:*:** wildcard resource pattern"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "WildcardResourceArn"
            Effect: Allow
            Action:
              - "s3:GetObject"
              - "s3:PutObject"
              - "s3:DeleteObject"
            Resource: "arn:aws:s3:::*"

  RedRole02WildcardResourceArn:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "RED-Role-02-WildcardResourceArn"
      Description: "[RED] Role with wildcard ARN resource"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RedPolicy02WildcardResourceArn
      Tags:
        - Key: Category
          Value: RED
        - Key: RiskLevel
          Value: Critical
        - Key: Hackathon
          Value: !Ref HackathonTag

  # --- RED Policy 3: Admin Role (Simulated Unused 90+ days) ---
  RedPolicy03UnusedAdminRole:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "RED-03-AdminRole-Unused90Days"
      Description: "[RED] Admin role unused for 90+ days simulation"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AdminAccess"
            Effect: Allow
            Action:
              - "iam:*"
              - "ec2:*"
              - "s3:*"
              - "rds:*"
              - "lambda:*"
            Resource: "*"

  RedRole03UnusedAdmin:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "RED-Role-03-UnusedAdmin-90Days"
      Description: "[RED] Simulated admin role unused for 90+ days"
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RedPolicy03UnusedAdminRole
      Tags:
        - Key: Category
          Value: RED
        - Key: RiskLevel
          Value: Critical
        - Key: LastUsed
          Value: "Simulated-90DaysAgo"
        - Key: Hackathon
          Value: !Ref HackathonTag

  # --- RED Policy 4: Cross-Account Trust No Conditions ---
  RedPolicy04CrossAccountNoConditions:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "RED-04-CrossAccount-NoConditions"
      Description: "[RED] Cross-account access with no MFA or condition constraints"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "CrossAccountFullS3"
            Effect: Allow
            Action: "s3:*"
            Resource: "*"

  RedRole04CrossAccountNoConditions:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "RED-Role-04-CrossAccount-NoConditions"
      Description: "[RED] Cross-account trust without MFA or IP conditions"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${TrustedAccountId}:root"
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RedPolicy04CrossAccountNoConditions
      Tags:
        - Key: Category
          Value: RED
        - Key: RiskLevel
          Value: Critical
        - Key: Hackathon
          Value: !Ref HackathonTag

  # --- RED Policy 5: Public-Facing Resource Access No Restrictions ---
  RedPolicy05PublicFacingNoRestrictions:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "RED-05-PublicFacing-NoRestrictions"
      Description: "[RED] Public-facing resource access with no IP/VPC restrictions"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "PublicS3NoRestrictions"
            Effect: Allow
            Action:
              - "s3:GetObject"
              - "s3:ListBucket"
              - "s3:PutObject"
            Resource: "*"

  RedRole05PublicFacingNoRestrictions:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "RED-Role-05-PublicFacing-NoRestrictions"
      Description: "[RED] Public-facing role with no access restrictions"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RedPolicy05PublicFacingNoRestrictions
      Tags:
        - Key: Category
          Value: RED
        - Key: RiskLevel
          Value: Critical
        - Key: Hackathon
          Value: !Ref HackathonTag

  # --- RED Policy 6: IAM Full Access (Privilege Escalation Risk) ---
  RedPolicy06IAMFullAccess:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "RED-06-IAMFullAccess-PrivEscRisk"
      Description: "[RED] Full IAM access enabling privilege escalation"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "IAMFullAccessPrivEsc"
            Effect: Allow
            Action: "iam:*"
            Resource: "*"

  RedRole06IAMFullAccess:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "RED-Role-06-IAMFullAccess"
      Description: "[RED] Full IAM access role - privilege escalation risk"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RedPolicy06IAMFullAccess
      Tags:
        - Key: Category
          Value: RED
        - Key: RiskLevel
          Value: Critical
        - Key: Hackathon
          Value: !Ref HackathonTag

  # --- RED Policy 7: Pass Role Wildcard ---
  RedPolicy07PassRoleWildcard:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "RED-07-PassRole-Wildcard"
      Description: "[RED] iam:PassRole on wildcard resource - privilege escalation"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "PassRoleWildcard"
            Effect: Allow
            Action:
              - "iam:PassRole"
              - "iam:CreateRole"
              - "iam:AttachRolePolicy"
            Resource: "*"

  RedRole07PassRoleWildcard:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "RED-Role-07-PassRole-Wildcard"
      Description: "[RED] PassRole wildcard - privilege escalation risk"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RedPolicy07PassRoleWildcard
      Tags:
        - Key: Category
          Value: RED
        - Key: RiskLevel
          Value: Critical
        - Key: Hackathon
          Value: !Ref HackathonTag

  # --- RED Policy 8: S3 Public Read/Write No Encryption ---
  RedPolicy08S3PublicReadWrite:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "RED-08-S3-PublicReadWrite-NoEncryption"
      Description: "[RED] S3 public read/write with no encryption requirement"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "S3PublicReadWrite"
            Effect: Allow
            Action:
              - "s3:*"
            Resource: "*"

  RedRole08S3PublicReadWrite:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "RED-Role-08-S3PublicReadWrite"
      Description: "[RED] S3 public read/write role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RedPolicy08S3PublicReadWrite
      Tags:
        - Key: Category
          Value: RED
        - Key: RiskLevel
          Value: Critical
        - Key: Hackathon
          Value: !Ref HackathonTag

  # --- RED Policy 9: KMS Wildcard Decrypt ---
  RedPolicy09KMSWildcardDecrypt:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "RED-09-KMS-WildcardDecrypt"
      Description: "[RED] KMS decrypt on all keys - no restriction"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "KMSWildcardDecrypt"
            Effect: Allow
            Action:
              - "kms:Decrypt"
              - "kms:DescribeKey"
              - "kms:GenerateDataKey"
              - "kms:ReEncrypt*"
            Resource: "*"

  RedRole09KMSWildcardDecrypt:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "RED-Role-09-KMS-WildcardDecrypt"
      Description: "[RED] KMS wildcard decrypt role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RedPolicy09KMSWildcardDecrypt
      Tags:
        - Key: Category
          Value: RED
        - Key: RiskLevel
          Value: Critical
        - Key: Hackathon
          Value: !Ref HackathonTag

  # --- RED Policy 10: Secrets Manager Full Access ---
  RedPolicy10SecretsManagerFull:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "RED-10-SecretsManager-FullAccess"
      Description: "[RED] Full Secrets Manager access - all secrets exposed"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "SecretsManagerFull"
            Effect: Allow
            Action: "secretsmanager:*"
            Resource: "*"

  RedRole10SecretsManagerFull:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "RED-Role-10-SecretsManager-Full"
      Description: "[RED] Full SecretsManager role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RedPolicy10SecretsManagerFull
      Tags:
        - Key: Category
          Value: RED
        - Key: RiskLevel
          Value: Critical
        - Key: Hackathon
          Value: !Ref HackathonTag

  # --- RED Policy 11: CloudTrail Disable/Delete ---
  RedPolicy11CloudTrailDisable:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "RED-11-CloudTrail-DisableDelete"
      Description: "[RED] Ability to disable/delete CloudTrail - audit evasion risk"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "CloudTrailDisableDelete"
            Effect: Allow
            Action:
              - "cloudtrail:DeleteTrail"
              - "cloudtrail:StopLogging"
              - "cloudtrail:UpdateTrail"
            Resource: "*"

  RedRole11CloudTrailDisable:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "RED-Role-11-CloudTrail-Disable"
      Description: "[RED] Role that can disable CloudTrail logging"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RedPolicy11CloudTrailDisable
      Tags:
        - Key: Category
          Value: RED
        - Key: RiskLevel
          Value: Critical
        - Key: Hackathon
          Value: !Ref HackathonTag

  # --- RED Policy 12: EC2 Full + Security Group Wildcard ---
  RedPolicy12EC2FullSecurityGroup:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "RED-12-EC2Full-SecurityGroup-Wildcard"
      Description: "[RED] EC2 full access + security group modify on all resources"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "EC2FullWildcard"
            Effect: Allow
            Action:
              - "ec2:*"
            Resource: "*"

  RedRole12EC2FullSecurityGroup:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "RED-Role-12-EC2Full-SecurityGroup"
      Description: "[RED] EC2 full access with wildcard SG modification"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RedPolicy12EC2FullSecurityGroup
      Tags:
        - Key: Category
          Value: RED
        - Key: RiskLevel
          Value: Critical
        - Key: Hackathon
          Value: !Ref HackathonTag

  # --- RED Policy 13: RDS Full Access No Encryption ---
  RedPolicy13RDSFullNoEncryption:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "RED-13-RDS-Full-NoEncryption"
      Description: "[RED] Full RDS access with no encryption enforcement"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "RDSFullNoEncryption"
            Effect: Allow
            Action: "rds:*"
            Resource: "*"

  RedRole13RDSFullNoEncryption:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "RED-Role-13-RDS-Full-NoEncryption"
      Description: "[RED] Full RDS access, no encryption enforced"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RedPolicy13RDSFullNoEncryption
      Tags:
        - Key: Category
          Value: RED
        - Key: RiskLevel
          Value: Critical
        - Key: Hackathon
          Value: !Ref HackathonTag

  # --- RED Policy 14: Lambda Wildcard Invoke ---
  RedPolicy14LambdaWildcardInvoke:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "RED-14-Lambda-WildcardInvoke"
      Description: "[RED] Lambda wildcard invoke - all functions accessible"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "LambdaWildcardInvoke"
            Effect: Allow
            Action: "lambda:*"
            Resource: "*"

  RedRole14LambdaWildcardInvoke:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "RED-Role-14-Lambda-WildcardInvoke"
      Description: "[RED] Lambda wildcard invoke role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RedPolicy14LambdaWildcardInvoke
      Tags:
        - Key: Category
          Value: RED
        - Key: RiskLevel
          Value: Critical
        - Key: Hackathon
          Value: !Ref HackathonTag

  # --- RED Policy 15: STS AssumeRole No MFA ---
  RedPolicy15STSAssumeRoleNoMFA:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "RED-15-STS-AssumeRole-NoMFA"
      Description: "[RED] STS AssumeRole without MFA requirement"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "STSAssumeRoleNoMFA"
            Effect: Allow
            Action: "sts:AssumeRole"
            Resource: "*"

  RedRole15STSAssumeRoleNoMFA:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "RED-Role-15-STS-AssumeRole-NoMFA"
      Description: "[RED] STS AssumeRole with no MFA condition"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${TrustedAccountId}:root"
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RedPolicy15STSAssumeRoleNoMFA
      Tags:
        - Key: Category
          Value: RED
        - Key: RiskLevel
          Value: Critical
        - Key: Hackathon
          Value: !Ref HackathonTag

  # --- RED Policy 16: DynamoDB Full Wildcard ---
  RedPolicy16DynamoDBFullWildcard:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "RED-16-DynamoDB-FullWildcard"
      Description: "[RED] DynamoDB full access on all tables"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "DynamoDBFullWildcard"
            Effect: Allow
            Action: "dynamodb:*"
            Resource: "*"

  RedRole16DynamoDBFullWildcard:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "RED-Role-16-DynamoDB-FullWildcard"
      Description: "[RED] DynamoDB full access all tables"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RedPolicy16DynamoDBFullWildcard
      Tags:
        - Key: Category
          Value: RED
        - Key: RiskLevel
          Value: Critical
        - Key: Hackathon
          Value: !Ref HackathonTag

  # --- RED Policy 17: SSM Full Parameter Store ---
  RedPolicy17SSMFullAccess:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "RED-17-SSM-FullAccess-AllParameters"
      Description: "[RED] Full SSM Parameter Store access - all secrets/configs exposed"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "SSMFullAccess"
            Effect: Allow
            Action: "ssm:*"
            Resource: "*"

  RedRole17SSMFullAccess:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "RED-Role-17-SSM-FullAccess"
      Description: "[RED] Full SSM access role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RedPolicy17SSMFullAccess
      Tags:
        - Key: Category
          Value: RED
        - Key: RiskLevel
          Value: Critical
        - Key: Hackathon
          Value: !Ref HackathonTag


  # ============================================================
  # █████╗ ███╗   ███╗██████╗ ███████╗██████╗    CATEGORY: AMBER
  # ██╔══██╗████╗ ████║██╔══██╗██╔════╝██╔══██╗   Policies 18–33
  # ███████║██╔████╔██║██████╔╝█████╗  ██████╔╝   Roles 18–33
  # ██╔══██║██║╚██╔╝██║██╔══██╗██╔══╝  ██╔══██╗
  # ██║  ██║██║ ╚═╝ ██║██████╔╝███████╗██║  ██║
  # ╚═╝  ╚═╝╚═╝     ╚═╝╚═════╝ ╚══════╝╚═╝  ╚═╝
  # ============================================================

  # --- AMBER Policy 18: Broad S3 Service Level ---
  AmberPolicy18BroadS3:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "AMBER-18-BroadS3-ServiceLevel"
      Description: "[AMBER] Broad s3:* on all buckets - no scoping"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "BroadS3Access"
            Effect: Allow
            Action: "s3:*"
            Resource: "*"

  AmberRole18BroadS3:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "AMBER-Role-18-BroadS3"
      Description: "[AMBER] Broad S3 service-level role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref AmberPolicy18BroadS3
      Tags:
        - Key: Category
          Value: AMBER
        - Key: RiskLevel
          Value: Moderate
        - Key: Hackathon
          Value: !Ref HackathonTag

  # --- AMBER Policy 19: Broad EC2 Service Level ---
  AmberPolicy19BroadEC2:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "AMBER-19-BroadEC2-ServiceLevel"
      Description: "[AMBER] Broad ec2:* without resource-level restriction"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "BroadEC2Access"
            Effect: Allow
            Action: "ec2:*"
            Resource: "*"
            Condition:
              StringEquals:
                "ec2:Region": "us-east-1"

  AmberRole19BroadEC2:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "AMBER-Role-19-BroadEC2"
      Description: "[AMBER] Broad EC2 service-level role with region condition"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref AmberPolicy19BroadEC2
      Tags:
        - Key: Category
          Value: AMBER
        - Key: RiskLevel
          Value: Moderate
        - Key: Hackathon
          Value: !Ref HackathonTag

  # --- AMBER Policy 20: Inactive Role 30-90 Days ---
  AmberPolicy20InactiveRole60Days:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "AMBER-20-InactiveRole-60Days"
      Description: "[AMBER] Role inactive for 30-90 days simulation"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "LimitedS3AndEC2"
            Effect: Allow
            Action:
              - "s3:GetObject"
              - "s3:ListBucket"
              - "ec2:DescribeInstances"
              - "ec2:StartInstances"
              - "ec2:StopInstances"
            Resource: "*"

  AmberRole20InactiveRole60Days:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "AMBER-Role-20-Inactive-60Days"
      Description: "[AMBER] Role simulated inactive for 60 days"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref AmberPolicy20InactiveRole60Days
      Tags:
        - Key: Category
          Value: AMBER
        - Key: RiskLevel
          Value: Moderate
        - Key: LastUsed
          Value: "Simulated-60DaysAgo"
        - Key: Hackathon
          Value: !Ref HackathonTag

  # --- AMBER Policy 21: Missing MFA Condition ---
  AmberPolicy21MissingMFA:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "AMBER-21-MissingMFA-Condition"
      Description: "[AMBER] Console-access policy without MFA enforcement"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "ConsoleWithoutMFA"
            Effect: Allow
            Action:
              - "s3:ListAllMyBuckets"
              - "s3:GetBucketLocation"
              - "cloudwatch:GetMetricStatistics"
              - "cloudwatch:ListMetrics"
            Resource: "*"

  AmberRole21MissingMFA:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "AMBER-Role-21-MissingMFA"
      Description: "[AMBER] Role without MFA condition on assume"
