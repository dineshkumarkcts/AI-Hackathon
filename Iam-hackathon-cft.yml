        - Key: RiskLevel
          Value: Low
        - Key: Purpose
          Value: "AIHackathon-BedrockInference"
        - Key: ReviewCycle
          Value: "30Days"
        - Key: Hackathon
          Value: !Ref HackathonTag

  # --- GREEN Policy 50: CloudFormation Scoped Stack Operations ---
  GreenPolicy50CFNScopedStack:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "GREEN-50-CFN-ScopedStack-Operations"
      Description: "[GREEN] CloudFormation scoped to hackathon stack with MFA and IP"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "CFNScopedStackOps"
            Effect: Allow
            Action:
              - "cloudformation:DescribeStacks"
              - "cloudformation:DescribeStackEvents"
              - "cloudformation:GetTemplate"
              - "cloudformation:ListStackResources"
            Resource:
              - !Sub "arn:aws:cloudformation:us-east-1:${AWS::AccountId}:stack/hackathon-*/*"
            Condition:
              Bool:
                "aws:MultiFactorAuthPresent": "true"
              IpAddress:
                "aws:SourceIp": "10.0.0.0/8"

  GreenRole50CFNScopedStack:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "GREEN-Role-50-CFN-ScopedStack"
      Description: "[GREEN] CloudFormation read role scoped to hackathon stacks"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
