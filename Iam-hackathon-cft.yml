  # --- GREEN Policy 41: ECS Task Scoped Execution ---
  GreenPolicy41ECSScopedExecution:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "GREEN-41-ECS-ScopedTaskExecution"
      Description: "[GREEN] ECS task execution scoped to specific ECR repo and log group"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "ECRScopedPull"
            Effect: Allow
            Action:
              - "ecr:GetAuthorizationToken"
            Resource: "*"
          - Sid: "ECRScopedImage"
            Effect: Allow
            Action:
              - "ecr:BatchGetImage"
              - "ecr:GetDownloadUrlForLayer"
            Resource:
              - !Sub "arn:aws:ecr:us-east-1:${AWS::AccountId}:repository/hackathon-ai-app"
          - Sid: "ScopedLogs"
            Effect: Allow
            Action:
              - "logs:CreateLogStream"
              - "logs:PutLogEvents"
            Resource:
              - !Sub "arn:aws:logs:us-east-1:${AWS::AccountId}:log-group:/ecs/hackathon:*"

  GreenRole41ECSScopedExecution:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "GREEN-Role-41-ECS-ScopedExecution"
      Description: "[GREEN] ECS execution role scoped to specific resources"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref GreenPolicy41ECSScopedExecution
      Tags:
        - Key: Category
          Value: GREEN
        - Key: RiskLevel
          Value: Low
