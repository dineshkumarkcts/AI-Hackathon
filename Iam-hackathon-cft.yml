  AmberPoliciesCount:
    Description: "AMBER (Moderate) policies created — Policies 18-33"
    Value: "16"

  GreenPoliciesCount:
    Description: "GREEN (Low Risk) policies created — Policies 34-50"
    Value: "17"

  TotalRolesCreated:
    Description: "Total IAM Roles created (AMBER-24 has 2 roles sharing one policy)"
    Value: "51"

  RedCategory:
    Description: "RED policies cover: wildcards, unused admins, no-MFA cross-account, public access"
    Value: "RED-Role-01 through RED-Role-17"

  AmberCategory:
    Description: "AMBER policies cover: broad service perms, inactive roles, missing constraints"
    Value: "AMBER-Role-18 through AMBER-Role-33 (24a and 24b)"

  GreenCategory:
    Description: "GREEN policies cover: scoped ARNs, MFA+IP conditions, purpose-matched"
    Value: "GREEN-Role-34 through GREEN-Role-50"

  BedrockAIRole:
    Description: "Hackathon AI inference role (Bedrock Claude) - GREEN-49"
    Value: !GetAtt GreenRole49BedrockScopedInvoke.Arn