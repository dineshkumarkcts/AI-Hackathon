  # --- GREEN Policy 48: SSM Scoped Param Read ---
  GreenPolicy48SSMScopedParamRead:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "GREEN-48-SSM-ScopedParamRead-Path"
      Description: "[GREEN] SSM GetParameter scoped to specific path prefix"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "SSMScopedParamRead"
            Effect: Allow
            Action:
              - "ssm:GetParameter"
              - "ssm:GetParametersByPath"
            Resource:
              - !Sub "arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/hackathon/*"
            Condition:
              Bool:
                "aws:MultiFactorAuthPresent": "true"

  GreenRole48SSMScopedParamRead:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "GREEN-Role-48-SSM-ScopedParam"
