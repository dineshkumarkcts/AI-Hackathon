  GreenPolicy47EventBridgeScoped:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "GREEN-47-EventBridge-ScopedRuleAccess"
      Description: "[GREEN] EventBridge scoped to specific rule and target"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "EventBridgeScopedRule"
            Effect: Allow
            Action:
              - "events:PutEvents"
            Resource:
              - !Sub "arn:aws:events:us-east-1:${AWS::AccountId}:event-bus/hackathon-bus"

  GreenRole47EventBridgeScoped:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "GREEN-Role-47-EventBridge-Scoped"
