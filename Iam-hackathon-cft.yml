      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "RDSScopedConnect"
            Effect: Allow
            Action:
              - "rds-db:connect"
            Resource:
              - !Sub "arn:aws:rds-db:us-east-1:${AWS::AccountId}:dbuser:hackathon-db/app_user"
            Condition:
              Bool:
                "aws:MultiFactorAuthPresent": "true"

  GreenRole45RDSScopedConnect:
