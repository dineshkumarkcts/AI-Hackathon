  # --- GREEN Policy 49: Bedrock Scoped Model Invoke ---
  GreenPolicy49BedrockScopedInvoke:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "GREEN-49-Bedrock-ScopedModelInvoke"
      Description: "[GREEN] Bedrock invoke scoped to specific model and VPC condition"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "BedrockScopedModelInvoke"
            Effect: Allow
            Action:
              - "bedrock:InvokeModel"
              - "bedrock:InvokeModelWithResponseStream"
            Resource:
              - !Sub "arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0"
            Condition:
              StringEquals:
                "aws:RequestedRegion": "us-east-1"

  GreenRole49BedrockScopedInvoke:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "GREEN-Role-49-Bedrock-ScopedInvoke"
      Description: "[GREEN] Bedrock invoke scoped to specific Claude model"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
