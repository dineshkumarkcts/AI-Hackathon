      Description: "[GREEN] CodePipeline scoped to specific pipeline and deploy bucket"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "CodePipelineSelf"
            Effect: Allow
            Action:
              - "codepipeline:GetPipeline"
              - "codepipeline:GetPipelineExecution"
              - "codepipeline:PutJobSuccessResult"
              - "codepipeline:PutJobFailureResult"
            Resource:
              - !Sub "arn:aws:codepipeline:us-east-1:${AWS::AccountId}:hackathon-pipeline"
          - Sid: "ScopedS3Deploy"
            Effect: Allow
            Action:
              - "s3:GetObject"
              - "s3:PutObject"
            Resource:
              - !Sub "arn:aws:s3:::${SandboxBucketName}/deployments/*"

  GreenRole42CodePipelineScoped:
